<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MailPass Admin</title>
  <link rel="icon" href="/static/assets/mailpass-icon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/assets/mailpass-icon-192.png">
  <link rel="stylesheet" href="/static/styles.css?v=mailpass-20260526-6">
</head>

<body>
  <main class="shell admin-shell">
    <section class="hero compact" aria-labelledby="admin-title">
      <div class="brand-lockup" aria-label="MailPass">
        <img class="brand-mark" src="/static/assets/mailpass-icon-192.png" alt="MailPass 图标">
        <span class="brand-name">MailPass</span>
      </div>
      <p class="eyebrow">Admin Console</p>
      <h1 id="admin-title" class="admin-title">账号通道控制台</h1>
      <form id="login-form" class="stack-form">
        <label class="field">
          <span>管理员密码</span>
          <input id="admin-password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">进入控制台</button>
      </form>

      <div id="admin-workspace" class="admin-workspace hidden">
        <form id="config-form" class="stack-form admin-panel">
          <div class="panel-heading">
            <h2>接口配置</h2>
            <p>保存上游 API 地址与 Bearer token，token 仅在服务端使用。</p>
          </div>
          <label class="field">
            <span>API 地址</span>
            <input id="base-url" type="url" placeholder="https://inbox.beastxa.com">
          </label>
          <label class="field">
            <span>Bearer Token</span>
            <input id="api-token" type="password" autocomplete="off" placeholder="留空则保持当前 token">
          </label>
          <button type="submit">保存配置</button>
        </form>

        <section class="admin-panel">
          <div class="panel-heading">
            <h2>账号导入</h2>
            <p>一行一条：邮箱号----密码----客户端 ID----刷新令牌。</p>
          </div>
          <label class="field">
            <span>批量导入</span>
            <textarea id="outlook-import-text" rows="7" spellcheck="false"
              placeholder="user@outlook.com----password----client-id----refresh-token"></textarea>
          </label>
          <div class="import-actions">
            <label class="file-picker">
              <input id="outlook-import-file" type="file" accept=".txt,.csv,text/plain">
              <span>选择文本文件</span>
            </label>
            <button id="outlook-import-button" type="button">导入账号</button>
          </div>
          <div id="outlook-import-result" class="inline-result"></div>
        </section>

        <section class="admin-panel">
          <div class="panel-heading">
            <h2>账号池</h2>
            <p id="outlook-list-count">0 个账号</p>
          </div>
          <div class="account-toolbar">
            <label class="field search-field">
              <span>搜索邮箱 / 别名</span>
              <input id="outlook-search" type="search" autocomplete="off" placeholder="输入邮箱、别名或片段">
            </label>
            <div id="outlook-used-filter" class="usage-filter" role="group" aria-label="使用状态筛选">
              <button type="button" class="active" data-used-filter="all">全部</button>
              <button type="button" data-used-filter="unused">未使用</button>
              <button type="button" data-used-filter="used">已使用</button>
            </div>
            <button id="outlook-export-button" type="button">导出选中</button>
            <button id="outlook-delete-selected-button" type="button">删除选中</button>
            <button id="outlook-code-test-selected-button" type="button">测试选中收码</button>
            <button id="chatgpt-test-selected-button" type="button">检测选中 ChatGPT</button>
            <button id="chatgpt-test-all-button" type="button">检测全部 ChatGPT</button>
          </div>
          <div class="account-table-wrap">
            <table class="account-table">
              <thead>
                <tr>
                  <th><input id="outlook-select-all" type="checkbox" aria-label="选择当前页全部账号"></th>
                  <th>邮箱</th>
                  <th>别名</th>
                  <th>状态</th>
                  <th>ChatGPT</th>
                  <th>使用</th>
                  <th>Client ID</th>
                  <th>Refresh Token</th>
                  <th>更新时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="outlook-accounts-body"></tbody>
            </table>
          </div>
        </section>
      </div>
      <div id="admin-status" class="status" role="status" aria-live="polite"></div>
    </section>
  </main>
  <a class="admin-link" href="/">返回</a>
  <dialog id="test-result-dialog" class="result-dialog">
    <form method="dialog">
      <div class="dialog-heading">
        <h2 id="dialog-title">测试结果</h2>
        <button value="close" aria-label="关闭">关闭</button>
      </div>
      <div id="dialog-body" class="dialog-body"></div>
    </form>
  </dialog>
  <script src="/static/admin.js?v=mailpass-20260526-6"></script>
</body>

</html>
