# mail.amazingzz.xyz - Edu Mail verification code receiver
limit_req_zone $binary_remote_addr zone=mail_public:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=mail_admin_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mail.amazingzz.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot/mail;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.amazingzz.xyz;

    ssl_certificate /etc/letsencrypt/live/mail.amazingzz.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.amazingzz.xyz/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    client_max_body_size 64k;

    location = /api/messages/code {
        limit_req zone=mail_public burst=8 nodelay;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/admin/login {
        limit_req zone=mail_admin_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
